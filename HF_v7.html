      <div class="ps-item"><div class="ps-num">${records.length}</div><div class="ps-lbl">${t('profile.records')}</div></div>
      <div class="ps-item"><div class="ps-num">${latest?latest.peso+'kg':'--'}</div><div class="ps-lbl">${t('profile.weight')}</div></div>
      <div class="ps-item"><div class="ps-num">${latest?latest.gordura+'%':'--'}</div><div class="ps-lbl">${t('profile.fat')}</div></div>
    </div>
    <div style="height:8px"></div>
    ${fio?`<div style="margin:12px 20px;padding:14px 16px;border-radius:var(--radius);background:rgba(255,77,141,.08);border:1px solid rgba(255,77,141,.3);display:flex;align-items:center;gap:12px"><span style="font-size:24px">💗</span><span style="font-size:13px;color:#ff8fb1;">${t('profile.fio_msg')}</span></div>`:''}
    <div class="profile-menu-item" onclick="showNav('workouts')"><span class="pmi-icon">🏋️</span><span class="pmi-label">${t('profile.my_workouts')}</span><span class="pmi-arrow">›</span></div>
    <div class="profile-menu-item" onclick="showNav('body')"><span class="pmi-icon">📊</span><span class="pmi-label">${t('profile.register')}</span><span class="pmi-arrow">›</span></div>
    <div class="profile-menu-item" onclick="showNav('progress')"><span class="pmi-icon">📈</span><span class="pmi-label">${t('profile.progress')}</span><span class="pmi-arrow">›</span></div>
    <div class="profile-menu-item" onclick="showNav('hiit')"><span class="pmi-icon">⚡</span><span class="pmi-label">${t('profile.hiit')}</span><span class="pmi-arrow">›</span></div>
    <div class="profile-menu-item" onclick="resetWorkouts()"><span class="pmi-icon">🔄</span><span class="pmi-label">${t('profile.reset')}</span><span class="pmi-arrow">›</span></div>
    <div class="divider"></div>
    <div class="profile-menu-item" onclick="doLogout()"><span class="pmi-icon pmi-danger">🚪</span><span class="pmi-label pmi-danger">${t('profile.logout')}</span><span class="pmi-arrow pmi-danger">›</span></div>
    <div style="height:20px"></div>`;
}
function resetWorkouts(){
  if(!confirm(t('profile.reset_confirm')))return;
  setUserData('customWorkouts',null);showToast(t('profile.reset_done'),'success');
}

// ================================================================
//  CALENDAR
// ================================================================
function renderCalendar(){
  if(!calViewMonth){
    const now=new Date();
    calViewMonth={year:now.getFullYear(),month:now.getMonth()};
  }
  const body=document.getElementById('calendarBody');
  const {year,month}=calViewMonth;
  const now=new Date();
  const months=t('months');
  const dayShort=t('days.short');

  // Compute all days with completion data for this month
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDOW=new Date(year,month,1).getDay(); // 0=Sun
  const streak=getStreak();

  // Month stats
  let fullDays=0,partialDays=0,totalWorkout=0;
  for(let d=1;d<=daysInMonth;d++){
    const dk=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const comp=getDayCompletion(dk);
    if(!comp)continue;
    const todayD=new Date(dk+'T12:00:00');
    if(todayD>now)continue;
    if(comp.isRest){/* skip */}
    else if(comp.done>=comp.total&&comp.total>0){fullDays++;totalWorkout++;}
    else if(comp.done>0){partialDays++;totalWorkout++;}
  }

  let html=``;

  // Streak card
  html+=`<div style="padding:16px 20px 0">
    <div class="streak-card">
      <div class="streak-num">${streak}</div>
      <div class="streak-info">
        <div class="streak-label">${t('cal.streak_label')}</div>
        <div class="streak-desc">${streak>0?streak+' '+t('cal.streak_days'):t('cal.streak_none')}</div>
      </div>
    </div>
  </div>`;

  // Stats row
  html+=`<div class="cal-stats">
    <div class="cal-stat"><div class="cal-stat-num green">${fullDays}</div><div class="cal-stat-lbl">${t('cal.stat_full')}</div></div>
    <div class="cal-stat"><div class="cal-stat-num orange">${partialDays}</div><div class="cal-stat-lbl">${t('cal.stat_partial')}</div></div>
    <div class="cal-stat"><div class="cal-stat-num blue">${totalWorkout}</div><div class="cal-stat-lbl">${t('cal.stat_total')}</div></div>
  </div>`;

  // Month nav
  html+=`<div style="padding:0 20px 12px">
    <div class="cal-month-nav">
      <button class="cal-month-btn" onclick="calPrevMonth()">‹</button>
      <div>
        <div class="cal-month-title">${months[month].toUpperCase()}</div>
        <div class="cal-month-year">${year}</div>
      </div>
      <button class="cal-month-btn" onclick="calNextMonth()">›</button>
    </div>
  </div>`;

  // Weekday headers
  html+=`<div class="cal-weekdays">`;
  dayShort.forEach(d=>{ html+=`<div class="cal-weekday">${d}</div>`; });
  html+=`</div>`;

  // Calendar grid
  html+=`<div class="cal-grid">`;
  // Empty cells before first day
  for(let e=0;e<firstDOW;e++) html+=`<div class="cal-day empty"></div>`;
  // Day cells
  for(let d=1;d<=daysInMonth;d++){
    const dk=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cellDate=new Date(dk+'T12:00:00');
    const isToday=cellDate.toDateString()===now.toDateString();
    const isFuture=cellDate>now&&!isToday;
    const comp=getDayCompletion(dk);
    let dayClass='cal-day';
    if(isToday)dayClass+=' today';
    if(isFuture)dayClass+=' future';
    let dots='';
    if(comp&&!isFuture){
      if(comp.isRest){
        dayClass+=' done-rest';
        dots=`<div class="cal-dots"><div class="cal-dot" style="background:var(--accent)"></div></div>`;
      } else if(comp.done>=comp.total&&comp.total>0){
        dayClass+=' done-full';
        dots=`<div class="cal-dots">${comp.exercises.slice(0,4).map(()=>`<div class="cal-dot" style="background:var(--success)"></div>`).join('')}</div>`;
      } else if(comp.done>0){
        dayClass+=' done-partial';
        const dotHtml=comp.exercises.slice(0,4).map((ex,i)=>{
          const exKey=ex.id||ex.name;
          const done=!!comp.exChecks[exKey];
          return`<div class="cal-dot" style="background:${done?'var(--success)':'var(--border)'}"></div>`;
        }).join('');
        dots=`<div class="cal-dots">${dotHtml}</div>`;
      }
    }
    const isSelected=calSelectedDay===dk;
    html+=`<div class="${dayClass}${isSelected?' today':''}" onclick="calSelectDay('${dk}')" style="${isSelected?'border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,212,255,.3)':''}">
      <div class="cal-day-num">${d}</div>
      ${dots}
    </div>`;
  }
  html+=`</div>`;

  // Legend
  html+=`<div class="section-title">${t('cal.legend')}</div>
    <div class="cal-legend">
      <div class="leg-item"><div class="leg-dot full"></div>${t('cal.full')}</div>
      <div class="leg-item"><div class="leg-dot partial"></div>${t('cal.partial')}</div>
      <div class="leg-item"><div class="leg-dot rest"></div>${t('cal.rest')}</div>
    </div>`;

  // Selected day detail
  if(calSelectedDay){
    const comp=getDayCompletion(calSelectedDay);
    const [sy,sm,sd]=calSelectedDay.split('-');
    const selDate=new Date(calSelectedDay+'T12:00:00');
    const dayName=t('days.long')[selDate.getDay()];
    const dateLabel=`${dayName}, ${parseInt(sd)} ${months[parseInt(sm)-1]}`;

    // Calorie breakdown
    const w = getUserWeight();
    let exKcal = 0;
    if(comp && comp.exChecks && !comp.isRest){
      comp.exercises.forEach(ex=>{
        if(comp.exChecks[ex.id||ex.name]) exKcal += calcExKcal(ex.id, w);
      });
    }
    const allHiitSessions = getUserData('hiit_sessions') || [];
    const dayHiitSessions = allHiitSessions.filter(s=>s.date===calSelectedDay);
    const hiitKcal = dayHiitSessions.reduce((a,s)=>a+s.kcal, 0);
    const totalKcal = exKcal + hiitKcal;

    if(comp){
      let badgeClass='rest'; let badgeText=t('cal.detail_rest');
      if(!comp.isRest){
        if(comp.done>=comp.total&&comp.total>0){badgeClass='full';badgeText=t('cal.detail_full');}
        else if(comp.done>0){badgeClass='partial';badgeText=t('cal.detail_partial');}
        else{badgeClass='partial';badgeText='0/'+comp.total;}
      }
      html+=`<div class="section-title">${dateLabel}</div>
        <div class="cal-day-detail">
          <div class="cdd-header">
            <div>
              <div class="cdd-title">${comp.woEmoji} ${comp.woName}</div>
              <div class="cdd-date">${!comp.isRest?comp.done+' '+t('cal.done_of')+' '+comp.total+' '+t('cal.done_exercises'):t('cal.rest')}</div>
            </div>
            <div class="cdd-badge ${badgeClass}">${badgeText}</div>
          </div>
          <div class="cdd-ex-list">`;
      if(comp.isRest){
        html+=`<div class="cdd-ex-row"><div class="cdd-ex-icon">😌</div><div class="cdd-ex-name">${t('cal.rest')}</div><div class="cdd-ex-status">✓</div></div>`;
      } else {
        comp.exercises.forEach(ex=>{
          const exKey=ex.id||ex.name;
          const done=!!comp.exChecks[exKey];
          const kcalEx = calcExKcal(ex.id, w);
          html+=`<div class="cdd-ex-row">
            <div class="cdd-ex-icon">${ex.icon}</div>
            <div class="cdd-ex-name" style="${done?'text-decoration:line-through;opacity:.5':''}'">${ex.name}</div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
              ${done?`<span style="font-size:11px;font-weight:700;color:var(--accent3);font-family:var(--font-mono)">~${kcalEx} kcal</span>`:''}
              <div class="cdd-ex-status">${done?'✅':'⭕'}</div>
            </div>
          </div>`;
        });
      }
      html+=`</div>`;

      // Calorie block — always show if there's something to show
      if(totalKcal > 0 || dayHiitSessions.length > 0){
        html+=`<div class="cdd-kcal-block">
          <div class="cdd-kcal-title">🔥 ${t('cal.kcal_total')}</div>`;

        // Exercise kcal row
        if(exKcal > 0){
          html+=`<div class="cdd-kcal-row">
            <span class="cdd-kcal-label"><span class="cdd-kcal-icon">🏋️</span>${t('cal.kcal_exercises')}</span>
            <span class="cdd-kcal-val">${exKcal} ${t('cal.kcal_unit')}</span>
          </div>`;
        }

        // HIIT sessions breakdown
        if(dayHiitSessions.length > 0){
          dayHiitSessions.forEach((s,idx)=>{
            const badgeCls = s.partial ? 'partial-s' : 'full-s';
            const badgeTxt = s.partial ? t('hiit.partial_badge') : 'HIIT';
            html+=`<div class="cdd-kcal-row">
              <span class="cdd-kcal-label">
                <span class="cdd-kcal-icon">⚡</span>
                <span>
                  ${t('cal.kcal_hiit')}${dayHiitSessions.length>1?' #'+(idx+1):''}
                  <span class="cdd-hiit-badge ${badgeCls}">${badgeTxt}</span>
                  <span style="font-size:11px;color:var(--text3);margin-left:4px">${formatSecs(s.elapsed)} · ${s.cycles} ciclos</span>
                </span>
              </span>
              <span class="cdd-kcal-val">${s.kcal} ${t('cal.kcal_unit')}</span>
            </div>`;
          });
        }

        // Total divider
        if(exKcal > 0 || hiitKcal > 0){
          html+=`<div class="cdd-kcal-total-row">
            <span class="cdd-kcal-total-label">🔥 Total do dia</span>
            <span class="cdd-kcal-total-val">${totalKcal} kcal</span>
          </div>`;
        }

        html+=`</div>`;
      }

      html+=`</div>`;

    } else {
      html+=`<div class="section-title">${dateLabel}</div>
        <div class="empty-state" style="padding:24px"><div class="es-icon">📭</div><div class="es-text">${t('cal.no_data')}</div></div>`;

      // Still show HIIT sessions if they exist even with no workout data
      if(dayHiitSessions.length > 0){
        html+=`<div class="cal-day-detail" style="margin-top:0">
          <div class="cdd-kcal-block" style="border-top:none">
            <div class="cdd-kcal-title">🔥 ${t('cal.kcal_total')}</div>`;
        dayHiitSessions.forEach((s,idx)=>{
          const badgeCls = s.partial ? 'partial-s' : 'full-s';
          const badgeTxt = s.partial ? t('hiit.partial_badge') : 'HIIT';
          html+=`<div class="cdd-kcal-row">
            <span class="cdd-kcal-label">
              <span class="cdd-kcal-icon">⚡</span>
              <span>${t('cal.kcal_hiit')}${dayHiitSessions.length>1?' #'+(idx+1):''}
                <span class="cdd-hiit-badge ${badgeCls}">${badgeTxt}</span>
                <span style="font-size:11px;color:var(--text3);margin-left:4px">${formatSecs(s.elapsed)} · ${s.cycles} ciclos</span>
              </span>
            </span>
            <span class="cdd-kcal-val">${s.kcal} ${t('cal.kcal_unit')}</span>
          </div>`;
        });
        html+=`<div class="cdd-kcal-total-row">
            <span class="cdd-kcal-total-label">🔥 Total do dia</span>
            <span class="cdd-kcal-total-val">${hiitKcal} kcal</span>
          </div></div></div>`;
      }
    }
  } else {
    html+=`<div style="text-align:center;padding:16px 20px;color:var(--text3);font-size:13px">${t('cal.tap')}</div>`;
  }

  html+=`<div style="height:20px"></div>`;
  body.innerHTML=html;
}

function calSelectDay(dk){
  calSelectedDay=(calSelectedDay===dk)?null:dk;
  renderCalendar();
  // Scroll to detail
  if(calSelectedDay){
    setTimeout(()=>{
      const b=document.getElementById('calendarBody');
      if(b)b.scrollTo({top:b.scrollHeight,behavior:'smooth'});
    },100);
  }
}
function calPrevMonth(){
  let {year,month}=calViewMonth;
  month--;if(month<0){month=11;year--;}
  calViewMonth={year,month};calSelectedDay=null;renderCalendar();
}
function calNextMonth(){
  let {year,month}=calViewMonth;
  const now=new Date();
  month++;if(month>11){month=0;year++;}
  // Don't go beyond current month
  if(year>now.getFullYear()||(year===now.getFullYear()&&month>now.getMonth())) return;
  calViewMonth={year,month};calSelectedDay=null;renderCalendar();
}
</script>
</body>
